name: Lint Check

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run HTMLHint
        run: npx htmlhint "**/*.html" --config .htmlhintrc.json
